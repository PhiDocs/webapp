# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 1
  timeoutSeconds: 120

env:
  # Supabase
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://seu-projeto.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # Assinafy API
  - variable: ASSINAFY_API_URL
    value: https://api.assinafy.com.br/v1
    availability:
      - BUILD
      - RUNTIME
  - variable: ASSINAFY_API_KEY
    secret: ASSINAFY_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: ASSINAFY_WORKSPACE_ACCOUNT_ID
    value: 10199457a9b2798c700de867896a
    availability:
      - BUILD
      - RUNTIME

  # Google AI (Gemini)
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: GENAI_MODEL
    value: googleai/gemini-2.5-flash
    availability:
      - BUILD
      - RUNTIME

  # PDF Cloud Function
  - variable: PDF_FUNCTION_URL
    value: https://generatepdf-dgh3pzxkta-uc.a.run.app
    availability:
      - RUNTIME
  - variable: PDF_FUNCTION_SECRET
    secret: PDF_FUNCTION_SECRET
    availability:
      - RUNTIME

  # n8n Webhook (opcional)
  - variable: N8N_PRODUCTION_URL
    value: https://seu.n8n.url/webhook/production
    availability:
      - RUNTIME
